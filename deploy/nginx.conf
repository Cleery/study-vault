server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    auth_basic "Math Question Bank";
    auth_basic_user_file /etc/nginx/.htpasswd-math-question-bank;
    client_max_body_size 12M;

    location /static/ {
        alias /srv/math-question-bank/shared/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/math-question-bank/shared/media/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://unix:/run/math-question-bank/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
