{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}数学题库{% endblock %}</title>
  {% block extra_head %}{% endblock %}
  <script>
    window.MathJax = {tex: {inlineMath: [['\\(', '\\)'], ['$', '$']]}};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header>
    <nav aria-label="主导航">
      <a href="/">题库</a>
      <a href="{% url 'question-create' %}">新建题目</a>
      <a href="{% url 'knowledge-card-list' %}">知识卡片</a>
      <a href="/health/">健康检查</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
